name: Build CodeQuest Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.1; must be higher than the current release)"
        required: true
        default: "0.1.1"
        type: string
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows-installer
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos-dmg-and-zip
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux-appimage
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set package version for this release
        working-directory: desktop
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION#desktop-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build installer and update metadata
        working-directory: desktop
        run: ${{ matrix.command }}
      - name: Upload installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*
            !desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers and updater metadata
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate required update metadata
        shell: bash
        run: |
          test -f release-assets/latest.yml
          test -f release-assets/latest-linux.yml
          test -f release-assets/latest-mac.yml
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CodeQuest ${{ github.event_name == 'workflow_dispatch' && format('desktop-v{0}', inputs.version) || github.ref_name }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('desktop-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          files: release-assets/*
