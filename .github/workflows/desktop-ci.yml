name: CodeQuest Desktop CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [main, desktop-app-integration]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test local indexer
        working-directory: desktop
        run: npm test
      - name: Validate JavaScript syntax
        working-directory: desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check assistant-renderer.js
          node --check local-indexer.cjs

  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        run: npm run dist:${{ matrix.target }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-${{ matrix.target }}-${{ github.sha }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [test, build-installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CodeQuest-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "${GITHUB_REF_NAME}" --generate-notes
