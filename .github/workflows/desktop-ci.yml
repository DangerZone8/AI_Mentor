name: CodeQuest Desktop CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "integrations/**"
      - ".gitmodules"
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, desktop-app-integration, desktop-integration-clean]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-upstream-pins:
    name: 0 - Validate unmodified upstream source pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned upstream revisions and untouched source trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C integrations/free-cluely rev-parse HEAD)" = "712ddb3474af22886cd47786f7bb0f0a5bf526df"
          test "$(git -C integrations/OpenCluely rev-parse HEAD)" = "c54c1199e3befda7649371c5283655f3bf27e724"
          test -f integrations/free-cluely/LICENSE
          test -f integrations/OpenCluely/LICENSE
          test -z "$(git -C integrations/free-cluely status --porcelain)"
          test -z "$(git -C integrations/OpenCluely status --porcelain)"
          echo "Both upstream repositories are checked out at the pinned commits with clean working trees."

  test:
    name: 1 - Unit tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test local indexer
        working-directory: desktop
        run: npm test
      - name: Test frontend syntax and AI feature wiring
        run: node --test frontend/tests/*.test.cjs
      - name: Validate JavaScript syntax
        working-directory: desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check assistant-renderer.js
          node --check local-indexer.cjs
          node --check api-url.cjs

  build-windows:
    name: 2 - Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-windows-${{ github.sha }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: 3 - macOS installer
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build macOS installer
        working-directory: desktop
        run: npm run dist:mac
      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-macos-${{ github.sha }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: 4 - Linux installer
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Linux installer
        working-directory: desktop
        run: npm run dist:linux
      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-linux-${{ github.sha }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
